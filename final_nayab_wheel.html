<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nayab Lucky Wheel 🤍</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#fff7fa,#ffffff);
display:flex;
justify-content:flex-start;
align-items:center;
flex-direction:column;
min-height:100vh;
padding:20px;
overflow:auto;
}

h1{
color:#ff4d6d;
margin-bottom:10px;
}

#resultBanner{
font-size:32px;
font-weight:bold;
color:#ff4d6d;
text-align:center;
min-height:100px;
margin-bottom:15px;
padding:10px;
}

#wheelContainer{
position:relative;
width:420px;
height:420px;
}

#pointer{
position:absolute;
top:-15px;
left:50%;
transform:translateX(-50%);
font-size:40px;
z-index:100;
}

#wheel{
width:420px;
height:420px;
border-radius:50%;
border:8px solid #ff4d6d;
transition:transform 5s cubic-bezier(.17,.67,.12,.99);
}

#spinBtn{
margin-top:25px;
padding:15px 35px;
border:none;
border-radius:30px;
background:#ff4d6d;
color:white;
font-size:20px;
cursor:pointer;
}

.heart{
position:absolute;
pointer-events:none;
}

</style>

</head>

<body>

<h1>🤍 Nayab Lucky Wheel 🤍</h1>

<div id="resultBanner">
Click SPIN 🤍
</div>

<div id="wheelContainer">

<div id="pointer">▼</div>

<canvas
id="wheel"
width="420"
height="420">
</canvas>

</div>

<button id="spinBtn" onclick="spinWheel()">
SPIN
</button>
<script>

const canvas =
document.getElementById("wheel");

const ctx =
canvas.getContext("2d");

const options = [

"🐼 Nayab Panda",

"🎉 Good News Milegi",

"🧹 Gandi Ladki",

"😎 Aayush Smart",

"😂 Nayab Dumb",

"😂 Aayush Dumb",

"🤍 Achhi Ladki",

"🧠 Nayab Samjhdar"

];

const colors = [

"#FFD6E8",
"#FFE5B4",
"#D6F5D6",
"#D6E4FF",
"#FFF0B3",
"#E6CCFF",
"#FFCCCC",
"#CCF2FF"

];

const totalSlices = 8;

const sliceAngle =
(2 * Math.PI) / totalSlices;

function drawWheel(){

for(let i=0;i<totalSlices;i++){

ctx.beginPath();

ctx.moveTo(210,210);

ctx.arc(
210,
210,
210,
i*sliceAngle,
(i+1)*sliceAngle
);

ctx.fillStyle =
colors[i];

ctx.fill();

ctx.strokeStyle =
"#ffffff";

ctx.lineWidth = 2;

ctx.stroke();

ctx.save();

ctx.translate(210,210);

ctx.rotate(
i*sliceAngle + sliceAngle/2
);

ctx.fillStyle = "#333";

ctx.font =
"bold 13px Arial";

ctx.textAlign = "right";

ctx.fillText(
options[i],
190,
5
);

ctx.restore();

}

}

drawWheel();

let currentRotation = 0;


let firstSpin = true;

const weightedResults = [

2,2,2,2,2,2,2,

0,0,0,0,

6,6,6,

1,1,

7,7,

3

];

let lastResult = -1;

function getWinningIndex(){

// First spin always Aayush Smart

if(firstSpin){

firstSpin = false;

lastResult = 3;

return 3;

}

let result;

do{

result =
weightedResults[
Math.floor(
Math.random() *
weightedResults.length
)
];

}
while(
result === lastResult &&
Math.random() < 0.60
);

lastResult = result;

return result;

}


let firstSpin = true;

const winningIndices = [

0, // Panda

1, // Good News

2, // Gandi Ladki

3  // Aayush Smart

];

function getWinningIndex(){

if(firstSpin){

firstSpin = false;

return 3;

}

return winningIndices[
Math.floor(
Math.random() *
winningIndices.length
)
];

}
function spinWheel(){

const selectedIndex =
getWinningIndex();

const degreesPerSlice =
360 / totalSlices;

const targetAngle =

360 -
(selectedIndex * degreesPerSlice)
- (degreesPerSlice / 2);

const extraSpins =
360 * 6;

currentRotation =
extraSpins + targetAngle;

document
.getElementById("wheel")
.style.transform =
`rotate(${currentRotation}deg)`;

setTimeout(()=>{

let resultText = "";

switch(selectedIndex){

case 0:

resultText =
"🐼 NAYAB PANDA HAI 🐼";

break;

case 1:

resultText =
"🎉 NAYAB WILL RECEIVE GOOD NEWS TODAY 🎉";

break;

case 2:

resultText =
"🧹 NAYAB GANDI LADKI HAI 🧹";

break;

case 3:

resultText =
"😎 AAYUSH IS INTELLIGENT AND SMART 😎";

break;

}

document
.getElementById("resultBanner")
.innerHTML =
resultText;

},5000);

}

// Floating Hearts

function createHeart(){

const heart =
document.createElement("div");

heart.classList.add("heart");

heart.innerHTML = "🤍";

heart.style.left =
Math.random()*100 + "vw";

heart.style.bottom =
"-20px";

heart.style.fontSize =
(15 + Math.random()*20) + "px";

heart.style.transition =
"transform 6s linear, opacity 6s linear";

document.body.appendChild(heart);

setTimeout(()=>{

heart.style.transform =
"translateY(-110vh)";

heart.style.opacity = "0";

},50);

setTimeout(()=>{

heart.remove();

},6000);

}

setInterval(createHeart,400);

</script>

</body>

</html>
