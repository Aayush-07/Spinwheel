<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nayab Lucky Wheel</title>
<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f7f2f5;
display:flex;
flex-direction:column;
align-items:center;
padding:20px;
}
h1{color:#ff4d6d;margin:10px 0;}
#resultBanner{
font-size:28px;
font-weight:bold;
color:#ff4d6d;
min-height:70px;
text-align:center;
}
#wheelContainer{position:relative;}
#pointer{
position:absolute;left:50%;top:-10px;
transform:translateX(-50%);
font-size:50px;z-index:10;
}
#wheel{
border:8px solid #ff4d6d;
border-radius:50%;
}
button{
margin-top:20px;
padding:12px 30px;
font-size:20px;
background:#ff4d6d;
color:white;border:none;border-radius:25px;
cursor:pointer;
}
</style>
</head>
<body>

<h1>🤍 Nayab Lucky Wheel 🤍</h1>
<div id="resultBanner">Click SPIN 🤍</div>

<div id="wheelContainer">
<div id="pointer">▼</div>
<canvas id="wheel" width="420" height="420"></canvas>
</div>

<button onclick="spinWheel()">SPIN</button>

<script>
const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");

const options=[
"🐼 Nayab Panda",
"🎉 Good News",
"🧹 Gandi Ladki",
"😎 Aayush Smart",
"😂 Nayab Dumb",
"😂 Aayush Dumb",
"🤍 Achhi Ladki",
"🧠 Nayab Samjhdar"
];

const colors=["#ffd6e8","#ffe5b4","#d6f5d6","#d6e4ff","#fff0b3","#e6ccff","#ffcccc","#ccf2ff"];
const total=options.length;
const slice=(2*Math.PI)/total;

function drawWheel(){
for(let i=0;i<total;i++){
ctx.beginPath();
ctx.moveTo(210,210);
ctx.arc(210,210,210,i*slice,(i+1)*slice);
ctx.fillStyle=colors[i];
ctx.fill();
ctx.strokeStyle="#fff";
ctx.stroke();

ctx.save();
ctx.translate(210,210);
ctx.rotate(i*slice+slice/2);
ctx.fillStyle="#333";
ctx.font="bold 12px Arial";
ctx.textAlign="right";
ctx.fillText(options[i],180,0);
ctx.restore();
}
}
drawWheel();

let rotation=0;
let firstSpin=true;
let last=-1;

const weighted=[2,2,2,2,2,2,0,0,0,1,1,6,6,7,3];

function pick(){
if(firstSpin){firstSpin=false; return 3;}
let r;
do{
r=weighted[Math.floor(Math.random()*weighted.length)];
}while(r===last && Math.random()<0.5);
last=r;
return r;
}

function spinWheel(){
const idx=pick();
const degPer=360/total;
const target=360-(idx*degPer)-(degPer/2);
rotation=2160+target;

document.getElementById("wheel").style.transition="transform 5s ease-out";
document.getElementById("wheel").style.transform=`rotate(${rotation}deg)`;

setTimeout(()=>{
const msgs={
0:"🐼 NAYAB PANDA HAI 🐼",
1:"🎉 NAYAB KO GOOD NEWS MILEGI 🎉",
2:"🧹 NAYAB GANDI LADKI HAI 🧹",
3:"😎 AAYUSH IS INTELLIGENT AND SMART 😎",
6:"🤍 NAYAB ACHHI LADKI HAI 🤍",
7:"🧠 NAYAB SAMJHDAR HAI 🧠"
};
document.getElementById("resultBanner").innerHTML=msgs[idx];
},5000);
}
</script>
</body>
</html>
